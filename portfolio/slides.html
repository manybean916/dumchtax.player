<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dumchtax Player — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark:    #0A0A0A;
  --bg-mid:     #141414;
  --bg-surface: #1C1C1C;
  --bg-light:   #F5F5F0;
  --bg-paper:   #F0EDE4;
  --accent:     #913439;
  --accent-dim: #5C1F22;
  --border:     #2C2C2C;
  --border-lt:  #DEDAD0;
  --white:      #F5F5F0;
  --ink:        #0A0A0A;
  --muted:      #5A5A5A;
  --muted-lt:   #9A9A9A;
  --mono: 'JetBrains Mono', Consolas, monospace;
  --body: system-ui, -apple-system, sans-serif;
  --script: 'Caveat', cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;font-family:var(--mono)}

/* ── Toolbar ── */
.toolbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:#0A0A0A;border-bottom:1px solid #1e1e1e;
  display:flex;align-items:center;gap:10px;padding:7px 16px;
  height:44px;
}
.toolbar button{
  background:var(--accent);border:none;color:#fff;
  padding:5px 13px;font-family:var(--mono);font-size:10px;
  cursor:pointer;letter-spacing:2px;transition:background .15s;
}
.toolbar button:hover{background:#b04448}
.tb-title{font-size:10px;color:#5a5a5a;letter-spacing:3px;margin-left:auto}
.tb-counter{font-size:11px;color:var(--white);letter-spacing:2px;min-width:60px;text-align:right}

/* ── Viewer ── */
.viewer{
  padding-top:44px;height:100vh;display:flex;
  flex-direction:column;align-items:center;
}

/* ── Slide ── */
.slide{
  position:relative;
  width:min(95vw, calc((100vh - 44px) * 16/9));
  aspect-ratio:16/9;
  overflow:hidden;
  flex-shrink:0;
  box-shadow:0 8px 40px rgba(0,0,0,.7);
}
.slide-inner{
  position:absolute;inset:0;
  /* Everything inside uses vw/vh units relative to slide size via container queries */
}

/* ── Slide thumbnails strip ── */
.thumbs{
  display:none;
  position:fixed;left:0;top:44px;bottom:0;width:160px;
  background:#0a0a0a;border-right:1px solid #1e1e1e;
  overflow-y:auto;z-index:100;padding:8px;gap:6px;
  flex-direction:column;
}
.thumb{
  width:100%;aspect-ratio:16/9;overflow:hidden;cursor:pointer;
  border:1px solid transparent;position:relative;font-size:0;
}
.thumb:hover,.thumb.active{border-color:var(--accent)}
.thumb iframe{
  width:400%;height:400%;transform:scale(0.25);transform-origin:0 0;
  pointer-events:none;
}

/* ── Slide navs ── */
body.show-thumbs .viewer{padding-left:160px}
body.show-thumbs .thumbs{display:flex}

/* fullscreen */
body.fs .toolbar{display:none}
body.fs .viewer{padding-top:0}
body.fs .slide{
  width:100vw;
  height:100vh;
  aspect-ratio:unset;
}

/* ══════════════════════════════════════════
   SLIDE CONTENT STYLES
   All sizes in cqw/cqh relative to slide container
════════════════════════════════════════════ */
.slide{container-type:size;container-name:slide}

/* typography helpers */
.mono{font-family:var(--mono)}
.body-font{font-family:var(--body)}
.script{font-family:var(--script)}

/* absolute placement helper */
.abs{position:absolute}

/* color backgrounds */
.bg-dark{background:var(--bg-dark)}
.bg-mid{background:var(--bg-mid)}
.bg-light{background:var(--bg-light)}
.bg-paper{background:var(--bg-paper)}
.bg-accent{background:var(--accent)}
.bg-accent-dim{background:var(--accent-dim)}

/* shapes */
.rect{position:absolute}
.circle{position:absolute;border-radius:50%}
.lp{position:absolute;border-radius:50%}
.lp-groove{position:absolute;border-radius:50%;border:1px solid #1e1e1e;background:transparent}

/* polaroid */
.polaroid{
  position:absolute;background:var(--bg-paper);
  box-shadow:4px 6px 20px rgba(0,0,0,.35);
}
.polaroid-photo{position:absolute}
.polaroid-cap{
  position:absolute;
  font-family:var(--script);
  color:#3A3835;
  text-align:center;
  line-height:1;
}

/* REC dot */
.rec-dot{position:absolute;border-radius:50%;background:var(--accent)}

/* text */
.t{
  position:absolute;
  white-space:pre-wrap;
  line-height:1.2;
  overflow:hidden;
}

/* fade-in on slide entry */
.slide .slide-inner{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* slide number badge */
.s-num{
  position:absolute;bottom:1.5cqh;right:1.5cqw;
  font-size:1.2cqh;font-family:var(--mono);
  color:#2C2C2C;letter-spacing:.15em;
}

/* ══ LP shape ══ */
.lp-outer{position:absolute;border-radius:50%;background:#0D0D0D;border:1px solid #222}
.lp-g1,.lp-g2,.lp-g3,.lp-g4{
  position:absolute;border-radius:50%;
  border:.3px solid #1e1e1e;background:transparent;
}
.lp-center{position:absolute;border-radius:50%}
.lp-hole{position:absolute;border-radius:50%;background:var(--bg-dark)}

/* ══ Camera shape ══ */
.cam-body{position:absolute;background:#1A1A1A;border-radius:3px}
.cam-top{position:absolute;background:#212121}
.cam-lens-ring{position:absolute;border-radius:50%;background:#111;border:1.5px solid #444}
.cam-lens-inner{position:absolute;border-radius:50%;background:#192838;border:.8px solid #2A4050}
.cam-lens-core{position:absolute;border-radius:50%;background:#142535}
.cam-vf{position:absolute;background:#0A1520}
.cam-flash{position:absolute;background:#181A10}
.cam-slot{position:absolute;background:#111}
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="prev()">◀ PREV</button>
  <button onclick="next()">NEXT ▶</button>
  <button onclick="toggleThumb()">SLIDES</button>
  <button onclick="toggleFS()">⛶ FULL</button>
  <span class="tb-counter" id="counter">1 / 17</span>
  <span class="tb-title">DUMCHTAX PLAYER · PORTFOLIO · 윤다빈</span>
</div>

<div class="viewer" id="viewer">
<!-- Slides injected by JS -->
</div>

<script>
/* ════════════════════════════════
   SLIDE DEFINITIONS
════════════════════════════════ */
const slides = [];

function slide(bg, fn) {
  slides.push({ bg, fn });
}

/* helpers that return HTML strings */
const R = (x,y,w,h,bg,extra='') =>
  `<div class="rect" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;background:${bg};${extra}"></div>`;

const C = (x,y,r,bg,extra='') =>
  `<div class="circle" style="left:${x}%;top:${y}%;width:${r}%;height:${r}%;background:${bg};${extra}"></div>`;

const T = (x,y,w,h,text,{size=2.4,color='#F5F5F0',mono=true,bold=false,italic=false,
  spacing=0,align='left',lineH=1.2}={}) => {
  const ff = mono ? "'JetBrains Mono',Consolas,monospace" : "'system-ui',sans-serif";
  const fw = bold ? 700 : 400;
  return `<div class="t" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;
    font-size:${size}cqh;font-family:${ff};font-weight:${fw};font-style:${italic?'italic':'normal'};
    color:${color};letter-spacing:${spacing}em;text-align:${align};line-height:${lineH};
    overflow:hidden;">${text.replace(/\n/g,'<br>')}</div>`;
};

const DOT = (x,y,r=1.2) =>
  `<div class="rec-dot" style="left:${x}%;top:${y}%;width:${r}%;height:${r}cqw;"></div>`;

function LP(x,y,sz, photoBg='#253035') {
  const s = sz;
  const c = s*0.38, hole = s*0.07;
  const cx = x+(s-c)/2, cy = y+(s-c)/2;
  const hx = x+(s-hole)/2, hy = y+(s-hole)/2;
  return `
  <div class="lp-outer" style="left:${x}%;top:${y}%;width:${s}%;height:${s}cqw;"></div>
  ${[0.82,0.74,0.66,0.58].map(g=>{
    const gx=x+(s-s*g)/2, gy=y+(s-s*g)/2;
    return `<div class="lp-groove" style="left:${gx}%;top:${gy}%;width:${s*g}%;height:${s*g}cqw;"></div>`;
  }).join('')}
  <div class="lp-center" style="left:${cx}%;top:${cy}%;width:${c}%;height:${c}cqw;background:${photoBg};border-radius:50%;"></div>
  <div class="lp-hole" style="left:${hx}%;top:${hy}%;width:${hole}%;height:${hole}cqw;border-radius:50%;background:#0A0A0A;"></div>`;
}

function POLAROID(x,y,w,h,{bg='#253035',cap='',rot=0,shadow=true}={}) {
  const pad=4, capH=12;
  const totalH = h + capH;
  const sh = shadow ? 'box-shadow:3px 5px 16px rgba(0,0,0,.4)' : '';
  return `<div class="polaroid" style="left:${x}%;top:${y}%;width:${w}%;height:${totalH}%;transform:rotate(${rot}deg);${sh}">
    <div style="position:absolute;left:${pad}%;top:${pad/2*(100/(totalH))}%;width:${100-pad*2}%;height:${(h/totalH*100)-pad/2*(100/(totalH))}%;background:${bg};"></div>
    <div style="position:absolute;bottom:2%;left:0;width:100%;text-align:center;font-family:'Caveat',cursive;font-size:2cqh;color:#3A3835;font-style:italic;">${cap}</div>
  </div>`;
}

function CAM(x,y,w,h) {
  const lx=x+w*0.1, ly=y+h*0.35, lr=w*0.3;
  return `
  <div class="cam-body" style="left:${x}%;top:${y+h*0.18}%;width:${w}%;height:${h*0.82}%;border-radius:2%"></div>
  <div class="cam-top" style="left:${x+1}%;top:${y}%;width:${w-2}%;height:${h*0.2}%;"></div>
  <div class="cam-lens-ring" style="left:${lx}%;top:${ly}%;width:${lr}%;height:${lr}cqw;border-radius:50%;"></div>
  <div class="cam-lens-inner" style="left:${lx+lr*0.12}%;top:${ly+lr*0.12}%;width:${lr*0.76}%;height:${lr*0.76}cqw;border-radius:50%;"></div>
  <div class="cam-lens-core" style="left:${lx+lr*0.26}%;top:${ly+lr*0.26}%;width:${lr*0.48}%;height:${lr*0.48}cqw;border-radius:50%;"></div>
  <div class="cam-vf" style="left:${x+w*0.05}%;top:${y+h*0.02}%;width:${w*0.15}%;height:${h*0.12}%;"></div>
  <div class="cam-flash" style="left:${x+w*0.25}%;top:${y+h*0.02}%;width:${w*0.22}%;height:${h*0.12}%;"></div>
  ${DOT(x+w*0.7, y+h*0.03, 1.4)}
  <div class="t" style="left:${x+w*0.75}%;top:${y+h*0.02}%;width:5%;height:5%;font-size:1.2cqh;color:#913439;font-family:monospace">REC</div>
  <div style="position:absolute;left:${x+w*0.12}%;top:${y+h*0.17}%;width:${w*0.6}%;height:${h*0.04}%;background:#111"></div>
  `;
}

const LABEL = (x,y,text,light=false) =>
  DOT(x,y+0.4,0.9) +
  T(x+2,y,20,4, text.toUpperCase(), {size:1.4,color:light?'#5A5A5A':'#9A9A9A',spacing:.3});

const HLINE = (x,y,w,color='#2C2C2C') =>
  R(x,y,w,0.15,color);

const SNUM = (n,total=17) =>
  `<div class="s-num">${String(n).padStart(2,'0')} / ${total}</div>`;

/* ════════
   SLIDES
════════ */

// 1 — COVER
slide('#0A0A0A', () => `
  ${R(0,0,100,0.7,'#913439')}
  ${DOT(4.2,6.5,1.4)}
  ${T(4.2,5.8,12,3,'REC',{size:1.6,color:'#913439',spacing:.4})}
  ${T(4.2,14,80,24,'DUMCHTAX',{size:20,bold:true,spacing:.06})}
  ${T(4.2,36,80,22,'PLAYER',{size:20,bold:true,color:'#913439',spacing:.06})}
  ${HLINE(4.2,64,44)}
  ${T(4.2,67,60,5,'PHOTO → MOOD → MUSIC  ·  UX/UI CASE STUDY',{size:1.7,color:'#9A9A9A',spacing:.45})}
  ${T(4.2,74,40,7,'윤다빈 / YUNDABIN',{size:3.2,spacing:.15})}
  ${T(4.2,82,35,5,'UX · UI DESIGNER',{size:2,color:'#8A8A8A',spacing:.4})}
  ${POLAROID(67,12,24,26,{bg:'#253040',cap:'Sun-Drenched',rot:4})}
  ${POLAROID(71,22,22,22,{bg:'#1A2030',cap:'Golden Hour',rot:-6})}
  ${LP(68.5,14,20,'#30404A')}
  ${R(0,98,100,2,'#5C1F22')}
  ${T(85,95,12,4,'2025',{size:1.4,color:'#2C2C2C',align:'right'})}
  ${SNUM(1)}
`);

// 2 — PROJECT OVERVIEW
slide('#F5F5F0', () => `
  ${LABEL(4.2,4.5,'01 / Project Overview',true)}
  ${T(4.2,10,70,14,'AT A GLANCE',{size:9,bold:true,spacing:.35,color:'#0A0A0A'})}
  ${HLINE(4.2,25,92,'#DEDAD0')}
  ${R(4.2,28,0.2,24,'#913439')} ${T(4.2,28,8,12,'3',{size:18,bold:true,color:'#913439'})}
  ${T(4.2,46,25,5,'SCREENS',{size:2.2,bold:true,color:'#0A0A0A',spacing:.3})}
  ${T(4.2,52,25,5,'HOME · PLAYER · LIBRARY',{size:2,color:'#5A5A5A',mono:false})}
  ${HLINE(34,29,0.15,'#DEDAD0',)}
  ${R(34.5,28,0.12,24,'#DEDAD0')}
  ${R(4.2,28,0.2,24,'#913439')}
  ${T(36,28,8,12,'2',{size:18,bold:true,color:'#913439'})}
  ${T(36,46,25,5,'AI MODELS',{size:2.2,bold:true,color:'#0A0A0A',spacing:.3})}
  ${T(36,52,25,5,'Gemini Vision + YouTube API',{size:2,color:'#5A5A5A',mono:false})}
  ${R(65.5,28,0.12,24,'#DEDAD0')}
  ${T(67,28,8,12,'0',{size:18,bold:true,color:'#913439'})}
  ${T(67,46,25,5,'FRAMEWORKS',{size:2.2,bold:true,color:'#0A0A0A',spacing:.3})}
  ${T(67,52,25,5,'Vanilla HTML / CSS / JS',{size:2,color:'#5A5A5A',mono:false})}
  ${T(4.2,62,60,5,'WHAT IS DUMCHTAX PLAYER?',{size:2,bold:true,color:'#0A0A0A',spacing:.35})}
  ${T(4.2,68,68,14,'사진 한 장을 찍으면 Gemini AI가 그 순간의 무드를 읽고, 어울리는 음악을 YouTube에서 찾아 재생합니다. 폴라로이드와 LP 바이닐의 아날로그 감성 속에서 디지털 음악 경험을 새롭게 정의합니다.',{size:2.2,color:'#5A5A5A',mono:false,lineH:1.6})}
  ${['#Digilog','#MoodMusic','#Polaroid','#LP','#AIPhoto','#Mobile'].map((t,i)=>
    R(4.2+i*15.6,83,15,7,'#EAEAE0','border:1px solid #DEDAD0;border-radius:2px') +
    T(4.2+i*15.6,84,15,5,t,{size:1.8,color:'#5A5A5A',align:'center',spacing:.1})
  ).join('')}
  ${CAM(78,60,18,28)}
  ${SNUM(2)}
`);

// 3 — PROBLEM SPACE
slide('#0A0A0A', () => `
  ${LABEL(4.2,4.5,'02 / Problem Space')}
  ${T(4.2,10,70,20,'WHY DOES THIS\nNEED TO EXIST?',{size:9,bold:true,spacing:.3,lineH:1.1})}
  ${HLINE(4.2,31,92)}
  ${[
    ['01','선택의 피로감','Decision Fatigue','플레이리스트 탐색에 지쳐 음악을 듣지 않는 사용자. 알고리즘 추천은 정확하지만 감성적 연결이 없다.'],
    ['02','휘발되는 추억','Ephemeral Moments','사진과 그 순간의 감정은 기억되지만, 그때 들었던 음악과의 연결은 사라진다. 기억을 아카이빙할 도구가 없다.'],
    ['03','아날로그 감성의 결핍','Missing Analog Soul','스트리밍 서비스는 편리하지만 음악을 소유하는 경험, 물성이 있는 감각을 줄 수 없다. 감성적 여백이 없다.'],
  ].map(([n,ko,en,desc],i)=>{
    const y = 35+i*20;
    return `
      ${T(4.2,y,8,10,n,{size:7,bold:true,color:'#5C1F22'})}
      ${T(12,y+0.5,28,7,ko,{size:4,bold:true})}
      ${T(12,y+9,28,5,en,{size:2,color:'#913439',spacing:.3})}
      ${T(42,y+1,54,12,desc,{size:2.2,color:'#8A8A8A',mono:false,lineH:1.55})}
      ${i<2?HLINE(4.2,y+18.5,92):''}`
  }).join('')}
  ${SNUM(3)}
`);

// 4 — SOLUTION
slide('#F5F5F0', () => `
  ${LABEL(4.2,4.5,'03 / Solution',true)}
  ${T(4.2,10,55,20,'DUMCHTAX\nSOLVES THIS.',{size:9,bold:true,color:'#0A0A0A',spacing:.3,lineH:1.05})}
  ${[
    ['◈','Multimodal 감성 매칭','사진 → Gemini Vision API → 무드 키워드 추출 → YouTube 검색. 알고리즘이 아닌 당신의 지금 이 순간이 플레이리스트를 만든다.','P0 CORE','#913439',4.2,36],
    ['◉','오브제 중심 아카이빙','폴라로이드 형태의 카드가 LIBRARY에 쌓인다. 사진 + 음악 + 순간을 하나의 오브제로 묶어 저장하고 재생한다.','P0 CORE','#913439',50.5,36],
    ['◫','아날로그 인터페이스','LP 회전, 아날로그 페이더 내비게이션, 폴라로이드 인화 애니메이션. 디지털이지만 손으로 만지는 것처럼 느껴지는 UX.','P1 DELIGHT','#5C1F22',4.2,64],
    ['◬','Zero Friction Onboarding','API 키 없이도 데모 모드로 즉시 사용 가능. 설정은 설정 모달 하나에서 끝난다.','P2 ACCESS','#5C1F22',50.5,64],
  ].map(([icon,title,desc,tag,tc,x,y])=>`
    ${R(x,y,45,24,y===36?'#EDEAE0':'#F0EDE4','border:1px solid #DEDAD0')}
    ${T(x+1.5,y+2.5,6,8,icon,{size:4,color:'#913439'})}
    ${R(x+33,y+2,11,5,tc)}
    ${T(x+33,y+2,11,5,tag,{size:1.5,color:'#fff',align:'center',spacing:.1})}
    ${T(x+1.5,y+10,42,5,title,{size:2.8,bold:true,color:'#0A0A0A'})}
    ${T(x+1.5,y+16,42,9,desc,{size:2,color:'#5A5A5A',mono:false,lineH:1.4})}
  `).join('')}
  ${SNUM(4)}
`);

// 5 — TARGET USER
slide('#F5F5F0', () => `
  ${LABEL(4.2,4.5,'04 / Target User',true)}
  ${T(4.2,10,70,12,'WHO IS THIS FOR?',{size:8,bold:true,color:'#0A0A0A',spacing:.4})}
  ${HLINE(4.2,22,92,'#DEDAD0')}
  ${R(4.2,25,27,70,'#F0EDE4','border:1px solid #DEDAD0')}
  ${C(7,27,18,'#D8D4C8')}
  ${C(10,28,12,'#B8B4A8')}
  ${T(5,56,27,5,'김지수 / 25세',{size:2.6,bold:true,color:'#0A0A0A',align:'center'})}
  ${T(5,62,27,7,'대학원생 / 사진 좋아하는\n감성 밀레니얼·Z세대',{size:2,color:'#5A5A5A',mono:false,align:'center',lineH:1.4})}
  ${['일상 사진 자주 촬영','음악은 무드로 선택','아날로그 물건 수집','Spotify 헤비유저'].map((t,i)=>
    DOT(5.5,72+i*5.5,1) + T(7.5,71+i*5.5,22,4.5,t,{size:2,color:'#5A5A5A',mono:false})
  ).join('')}

/* ════════════════════════════════
   RENDER ENGINE
════════════════════════════════ */
let current = 0;
const viewer = document.getElementById('viewer');

function render() {
  viewer.innerHTML = '';
  const { bg, fn } = slides[current];
  const div = document.createElement('div');
  div.className = 'slide';
  div.style.background = bg;
  div.innerHTML = `<div class="slide-inner">${fn()}</div>`;
  viewer.appendChild(div);
}

function go(n) {
  current = ((n % slides.length) + slides.length) % slides.length;
  render();
  document.getElementById('counter').textContent = `${current+1} / ${slides.length}`;
}
function next() { go(current + 1); }
function prev() { go(current - 1); }
function toggleThumb() { document.body.classList.toggle('show-thumbs'); }
function toggleFS() { document.body.classList.toggle('fs'); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') next();
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') prev();
  if (e.key==='f'||e.key==='F') toggleFS();
  if (e.key==='Escape') document.body.classList.remove('fs');
});

// Touch swipe
let tx=0;
viewer.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
viewer.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){dx<0?next():prev();}
});

go(0);
</script>
